services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: escola
      POSTGRES_PASSWORD: escola
      POSTGRES_DB: escola
    ports:
      - "5432:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escola"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://escola:escola@db:5432/escola
      JWT_SECRET: ${JWT_SECRET:-segredo-apenas-para-desenvolvimento}
      ADMIN_NOME: Administrador
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@exemplo.com}
      ADMIN_SENHA: ${ADMIN_SENHA:-admin12345}
    command: sh -c "npm run migrate && npm run seed && npm start"

volumes:
  dados:
