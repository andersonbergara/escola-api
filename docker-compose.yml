# Todos os segredos vêm do arquivo .env (copie de .env.example). Não há valores padrão:
# se algum estiver faltando, o `docker compose up` falha com uma mensagem explicando.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: escola
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: escola
    # A porta do banco NÃO é publicada no computador: só a API, na rede interna
    # do compose, consegue falar com o PostgreSQL.
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escola"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Publicada apenas em 127.0.0.1. Para expor na internet, use um proxy reverso com HTTPS.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://escola:${POSTGRES_PASSWORD}@db:5432/escola
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env (openssl rand -hex 32)}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL no arquivo .env}
      ADMIN_SENHA: ${ADMIN_SENHA:?Defina ADMIN_SENHA no arquivo .env}
      TRUST_PROXY: ${TRUST_PROXY:-}
    command: sh -c "npm run migrate && npm run seed && npm start"

volumes:
  dados:
